<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 绘本世界 · 🎬 视频世界</title>
<style>
/* ======================== 主题变量 ======================== */
:root {
    --bg-primary: #faf8f5;
    --bg-secondary: #ffffff;
    --bg-card: #ffffff;
    --text-primary: #2d2a26;
    --text-secondary: #6b6560;
    --text-muted: #9b9590;
    --border-color: rgba(0,0,0,0.06);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.12);
    --shadow-glow: 0 0 30px rgba(255,180,100,0.15);
    --accent: #e8723c;
    --accent-2: #3c8ce8;
    --accent-light: #ffeedd;
    --accent-gradient: linear-gradient(135deg, #e8723c 0%, #f0a05c 100%);
    --accent-gradient-v: linear-gradient(135deg, #3c8ce8 0%, #6cb4ff 100%);
    --glass-bg: rgba(255,255,255,0.75);
    --glass-border: rgba(255,255,255,0.3);
    --nav-bg: rgba(250,248,245,0.92);
    --overlay-bg: rgba(0,0,0,0.4);
    --player-bg: linear-gradient(180deg, #fefcf9 0%, #f8f4ef 100%);
    --tag-bg: #f0ebe5;
    --tag-text: #7a6f68;
    --scrollbar-thumb: rgba(0,0,0,0.15);
    --progress-bg: rgba(0,0,0,0.06);
    --page-shadow: rgba(0,0,0,0.15);
}
[data-theme="dark"] {
    --bg-primary: #1a1915;
    --bg-secondary: #252320;
    --bg-card: #2d2a26;
    --text-primary: #f0ebe3;
    --text-secondary: #a89f95;
    --text-muted: #6b6560;
    --border-color: rgba(255,255,255,0.07);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
    --shadow-md: 0 4px 20px rgba(0,0,0,0.3);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.4);
    --accent: #f08850;
    --accent-2: #6cb4ff;
    --accent-light: #3d2818;
    --accent-gradient: linear-gradient(135deg, #f08850 0%, #f0a05c 100%);
    --accent-gradient-v: linear-gradient(135deg, #5aa0ff 0%, #8ccaff 100%);
    --glass-bg: rgba(37,35,32,0.85);
    --glass-border: rgba(255,255,255,0.08);
    --nav-bg: rgba(26,25,21,0.94);
    --overlay-bg: rgba(0,0,0,0.6);
    --player-bg: linear-gradient(180deg, #252320 0%, #1a1915 100%);
    --tag-bg: #3d3832;
    --tag-text: #a89f95;
    --scrollbar-thumb: rgba(255,255,255,0.15);
    --progress-bg: rgba(255,255,255,0.08);
    --page-shadow: rgba(0,0,0,0.4);
}
[data-theme="sepia"] {
    --bg-primary: #f5efe6;
    --bg-secondary: #fdf8ee;
    --bg-card: #fffdf8;
    --text-primary: #433422;
    --text-secondary: #6b5a45;
    --text-muted: #8c7a63;
    --border-color: rgba(139,109,66,0.12);
    --shadow-sm: 0 2px 8px rgba(139,109,66,0.06);
    --shadow-md: 0 4px 20px rgba(139,109,66,0.1);
    --shadow-lg: 0 8px 40px rgba(139,109,66,0.15);
    --accent: #c47a3a;
    --accent-2: #5a92c4;
    --accent-light: #f5e6d3;
    --accent-gradient: linear-gradient(135deg, #b86e30 0%, #d4944a 100%);
    --accent-gradient-v: linear-gradient(135deg, #4a82b8 0%, #7aa4d4 100%);
    --glass-bg: rgba(253,248,238,0.82);
    --glass-border: rgba(200,170,120,0.2);
    --nav-bg: rgba(245,239,230,0.93);
    --player-bg: linear-gradient(180deg, #fdf8ee 0%, #f5efe6 100%);
    --tag-bg: #ede3d4;
    --tag-text: #7a6345;
}
/* 视频模式主色切换 */
[data-mode="videos"] { --accent: var(--accent-2); --accent-gradient: var(--accent-gradient-v); }

/* ======================== 基础样式 ======================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg-primary); color: var(--text-primary);
    line-height: 1.6; min-height: 100vh;
    transition: background 0.4s ease, color 0.3s ease;
}
a { color: inherit; text-decoration: none; cursor: pointer; }
button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 5px; }
::-webkit-scrollbar-track { background: transparent; }

/* Loading Overlay */
.loading-overlay { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: var(--bg-primary);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 9999; transition: opacity 0.4s ease; }
.loading-overlay.hidden { opacity: 0; pointer-events: none; }
.loading-spinner { width: 40px; height: 40px; border: 3px solid var(--border-color);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
.loading-text { margin-top: 16px; color: var(--text-secondary); font-size: 14px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ======================== 导航栏 ======================== */
.navbar { position: fixed; top: 0; left: 0; right: 0; z-index: 500;
    background: var(--nav-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-color);
    padding: 0 24px; height: 58px; display: flex; align-items: center; gap: 16px; }
.nav-brand { display: flex; align-items: center; gap: 8px; }
.nav-brand .logo-icon { font-size: 24px; }
.nav-brand h1 { font-size: 18px; font-weight: 700; color: var(--text-primary); }
.logo-accent { background: var(--accent-gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* Tab 切换 */
.mode-tabs { display: flex; gap: 2px; background: var(--tag-bg); padding: 3px; border-radius: 10px; }
.mode-tab { padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
    color: var(--text-secondary); transition: all 0.2s ease; display: flex; align-items: center; gap: 5px; }
.mode-tab.active { background: var(--bg-card); color: var(--text-primary); box-shadow: var(--shadow-sm); }
.mode-tab:hover:not(.active) { color: var(--text-primary); }

.nav-center { flex: 1; display: flex; justify-content: center; padding: 0 24px; }
.nav-search { position: relative; width: 100%; max-width: 440px; }
.nav-search input { width: 100%; height: 38px; padding: 0 40px 0 16px; border-radius: 20px;
    border: 1px solid var(--border-color); background: var(--bg-secondary); color: var(--text-primary);
    font-size: 13px; transition: all 0.2s ease; }
.nav-search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232,114,60,0.1); }
.search-icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }

.nav-actions { display: flex; gap: 6px; align-items: center; position: relative; }
.nav-btn { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center;
    justify-content: center; font-size: 16px; color: var(--text-secondary); position: relative;
    transition: all 0.2s ease; }
.nav-btn:hover { background: var(--tag-bg); color: var(--text-primary); }
.nav-btn.active { background: var(--accent); color: white; }
.badge-count { position: absolute; top: 2px; right: 2px; background: var(--accent);
    color: white; font-size: 9px; font-weight: 700; min-width: 16px; height: 16px;
    border-radius: 8px; padding: 0 4px; display: flex; align-items: center; justify-content: center; }

.theme-dropdown { position: absolute; top: calc(100% + 6px); right: 0; background: var(--bg-card);
    border: 1px solid var(--border-color); border-radius: 10px; box-shadow: var(--shadow-lg);
    padding: 6px; display: none; flex-direction: column; gap: 2px; min-width: 140px; z-index: 1000; }
.theme-dropdown.show { display: flex; }
.theme-option { padding: 8px 12px; border-radius: 6px; display: flex; align-items: center;
    gap: 8px; font-size: 13px; transition: background 0.2s ease; text-align: left; }
.theme-option:hover { background: var(--tag-bg); }
.theme-option.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
.theme-dot { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--border-color); }
.theme-dot.light { background: #faf8f5; }
.theme-dot.dark { background: #1a1915; }
.theme-dot.sepia { background: #f5efe6; }

/* ======================== 主内容 ======================== */
.main-content { padding-top: 70px; min-height: 100vh; }
.container { max-width: 1400px; margin: 0 auto; padding: 0 24px; }

.hero-section { padding: 18px 0 14px; text-align: center; }
.hero-title { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
.hero-subtitle { font-size: 13px; color: var(--text-secondary); }

/* 过滤栏 */
.filter-bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
    justify-content: space-between; padding: 12px 0; }
.filter-left { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.stats-inline { display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; color: var(--text-secondary); align-items: center; }
.stat-inline strong { color: var(--accent); font-size: 14px; font-weight: 700; }
.stat-divider { width: 1px; height: 14px; background: var(--border-color); }
.filter-label { font-size: 13px; color: var(--text-secondary); }
.series-dropdown-wrapper { position: relative; }
.series-dropdown-input { width: 200px; height: 34px; padding: 0 32px 0 12px;
    border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-secondary);
    color: var(--text-primary); font-size: 13px; cursor: pointer; }
.series-dropdown-input:focus { outline: none; border-color: var(--accent); }
.dropdown-arrow { position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    color: var(--text-muted); font-size: 10px; pointer-events: none; }
.series-dropdown-list { position: absolute; top: calc(100% + 4px); left: 0;
    background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px;
    box-shadow: var(--shadow-lg); max-height: 340px; overflow-y: auto; min-width: 220px;
    max-width: 360px; padding: 4px; display: none; z-index: 100; }
.series-dropdown-list.show { display: block; }
.series-option { display: flex; justify-content: space-between; align-items: center;
    padding: 7px 10px; border-radius: 6px; font-size: 13px; width: 100%; text-align: left; transition: background 0.15s ease; }
.series-option:hover { background: var(--tag-bg); }
.series-option.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
.opt-count { font-size: 11px; color: var(--text-muted); background: var(--tag-bg); padding: 1px 7px; border-radius: 10px; }

.sort-options { display: flex; gap: 4px; flex-wrap: wrap; }
.sort-btn { padding: 5px 10px; border-radius: 6px; font-size: 11px; color: var(--text-secondary);
    background: var(--tag-bg); transition: all 0.2s ease; }
.sort-btn.active { background: var(--accent); color: white; }
.sort-btn:hover:not(.active) { background: var(--accent-light); color: var(--accent); }

.random-pick-btn { padding: 8px 18px; background: var(--accent-gradient); color: white;
    border-radius: 20px; font-size: 13px; font-weight: 600; margin: 6px 0 14px;
    box-shadow: var(--shadow-md); transition: transform 0.15s ease; }
.random-pick-btn:hover { transform: translateY(-1px) scale(1.02); }

/* ======================== 卡片网格 ======================== */
.books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 18px; padding-bottom: 40px; }
.videos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; padding-bottom: 40px; }

/* 绘本卡 */
.book-card { background: var(--bg-card); border-radius: 12px; overflow: hidden;
    box-shadow: var(--shadow-sm); transition: all 0.25s ease; cursor: pointer;
    display: flex; flex-direction: column; animation: cardIn 0.3s ease both; }
@keyframes cardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.book-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
.card-cover-wrapper { position: relative; aspect-ratio: 3/4; overflow: hidden; background: var(--tag-bg); }
.card-cover { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
.book-card:hover .card-cover { transform: scale(1.04); }
.card-fav-btn { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px;
    border-radius: 50%; background: rgba(255,255,255,0.9); color: #e74c3c; font-size: 14px;
    display: flex; align-items: center; justify-content: center; transition: transform 0.2s ease; }
.card-fav-btn:hover { transform: scale(1.12); }
.card-fav-btn.favorited { color: #e74c3c; }
.card-series-tag { position: absolute; bottom: 6px; left: 6px; background: rgba(0,0,0,0.62);
    color: white; font-size: 10px; padding: 2px 8px; border-radius: 10px; backdrop-filter: blur(4px); max-width: 80%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.card-info { padding: 10px 12px 12px; }
.card-title { font-size: 13px; font-weight: 600; line-height: 1.35; color: var(--text-primary);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    min-height: 34px; margin-bottom: 6px; }
.card-meta { display: flex; gap: 8px; align-items: center; font-size: 11px; color: var(--text-secondary); flex-wrap: wrap; }

/* 视频卡 */
.video-card { background: var(--bg-card); border-radius: 14px; overflow: hidden;
    box-shadow: var(--shadow-sm); transition: all 0.25s ease; cursor: pointer;
    display: flex; flex-direction: column; animation: cardIn 0.3s ease both; }
.video-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
.video-thumb-wrapper { position: relative; aspect-ratio: 16/9; background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%); overflow: hidden; }
.video-thumb { width: 100%; height: 100%; object-fit: cover; background: #0d0d0d; display: block; }
.video-card:hover .video-thumb { opacity: 0.86; }
@supports not (aspect-ratio: 1 / 1) {
    .card-cover-wrapper { height: 0; padding-top: 133.33%; }
    .video-thumb-wrapper { height: 0; padding-top: 56.25%; }
    .card-cover, .video-thumb { position: absolute; top: 0; left: 0; }
}
.video-thumb-placeholder { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.25); font-size: 42px; pointer-events: none; }
.video-play-overlay { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: center;
    justify-content: center; pointer-events: none; transition: all 0.2s ease; }
.video-play-icon { width: 52px; height: 52px; border-radius: 50%; background: rgba(0,0,0,0.55);
    color: white; font-size: 22px; display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(6px); transition: transform 0.2s ease; }
.video-card:hover .video-play-icon { transform: scale(1.12); background: var(--accent); }
.video-duration { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.72);
    color: white; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-variant-numeric: tabular-nums; }
.video-series-tag { position: absolute; bottom: 6px; left: 6px; background: rgba(0,0,0,0.62);
    color: white; font-size: 10px; padding: 2px 8px; border-radius: 10px; backdrop-filter: blur(4px);
    max-width: 70%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.video-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,0.25); }
.video-progress-fill { height: 100%; background: var(--accent); transition: width 0.2s ease; }
.video-card-info { padding: 10px 12px 12px; }
.video-card-title { font-size: 13px; font-weight: 600; line-height: 1.4; color: var(--text-primary);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 36px; margin-bottom: 6px; word-break: break-word; }
.video-card-meta { display: flex; gap: 8px; align-items: center; font-size: 11px;
    color: var(--text-secondary); flex-wrap: wrap; justify-content: space-between; }

/* 空状态 */
.empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-secondary); }
.empty-icon { font-size: 52px; margin-bottom: 12px; opacity: 0.5; }
.empty-title { font-size: 16px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
.empty-desc { font-size: 13px; }

/* ======================== 绘本播放器 ======================== */
.player-view { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: var(--player-bg); z-index: 900;
    display: none; flex-direction: column; animation: fadeIn 0.25s ease; }
.player-view.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.player-header { display: flex; align-items: center; padding: 12px 20px;
    border-bottom: 1px solid var(--border-color); gap: 14px; background: var(--bg-secondary); transition: opacity 0.3s; }
.player-back { padding: 7px 14px; border-radius: 8px; background: var(--tag-bg);
    font-size: 13px; color: var(--text-primary); }
.player-back:hover { background: var(--accent); color: white; }
.player-title-area { flex: 1; min-width: 0; }
.player-book-title { font-size: 16px; font-weight: 700; color: var(--text-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player-series { font-size: 12px; color: var(--text-secondary); }
.player-actions { display: flex; gap: 8px; }
.p-action-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--tag-bg);
    color: var(--text-primary); display: flex; align-items: center; justify-content: center; font-size: 15px; }
.p-action-btn:hover { background: var(--accent); color: white; }
.p-action-btn.fav-active { color: #e74c3c; }

.player-stage { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 16px; }
.stage-close-btn, .stage-fs-btn { position: absolute; top: 14px; z-index: 10;
    width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,0.45);
    color: white; display: flex; align-items: center; justify-content: center; font-size: 16px;
    backdrop-filter: blur(6px); transition: all 0.2s ease, opacity 0.3s ease; }
.stage-close-btn { right: 60px; }
.stage-fs-btn { right: 14px; }
.stage-close-btn:hover, .stage-fs-btn:hover { background: var(--accent); }

.stage-nav-left, .stage-nav-right { position: absolute; top: 50%; transform: translateY(-50%);
    width: 42px; height: 42px; border-radius: 50%; background: rgba(0,0,0,0.35); color: white;
    display: flex; align-items: center; justify-content: center; font-size: 16px; backdrop-filter: blur(4px); z-index: 5; }
.stage-nav-left { left: 20px; }
.stage-nav-right { right: 20px; }
.stage-nav-left:hover, .stage-nav-right:hover { background: var(--accent); }

.page-container { position: relative; max-width: 100%; max-height: 100%; display: flex;
    flex-direction: column; align-items: center; }
.page-image-wrapper { display: flex; align-items: center; justify-content: center; max-width: 100%; }
.page-image { max-width: 100%; max-height: calc(100vh - 320px); object-fit: contain;
    border-radius: 6px; box-shadow: 0 12px 40px var(--page-shadow); }
.page-indicator { margin-top: 10px; padding: 4px 12px; background: rgba(0,0,0,0.5);
    color: white; border-radius: 12px; font-size: 12px; backdrop-filter: blur(4px); }
.flip-out { animation: flipOut 0.18s ease both; }
.flip-in { animation: flipIn 0.18s ease both; }
@keyframes flipOut { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.96); } }
@keyframes flipIn { from { opacity: 0; transform: scale(1.04); } to { opacity: 1; transform: scale(1); } }

.page-strip { display: flex; gap: 6px; padding: 8px 16px; overflow-x: auto;
    background: var(--bg-secondary); border-top: 1px solid var(--border-color);
    scrollbar-width: thin; transition: opacity 0.3s; }
.strip-thumb { flex-shrink: 0; width: 44px; height: 56px; border-radius: 4px;
    cursor: pointer; opacity: 0.55; transition: all 0.2s ease;
    border: 2px solid transparent; background: var(--tag-bg) center / cover no-repeat;
    color: var(--text-muted); font-size: 11px; text-align: center; line-height: 52px; }
.strip-thumb.loaded { color: transparent; }
.strip-thumb:hover { opacity: 0.85; }
.strip-thumb.active { opacity: 1; border-color: var(--accent); }

.player-controls { padding: 12px 20px 16px; background: var(--bg-secondary);
    border-top: 1px solid var(--border-color); transition: opacity 0.3s; }
.progress-container { position: relative; height: 14px; cursor: pointer; padding: 6px 0; margin-bottom: 6px; }
.progress-bar { height: 4px; background: var(--progress-bg); border-radius: 2px; position: relative; }
.progress-fill { height: 100%; background: var(--accent-gradient); border-radius: 2px; transition: width 0.15s ease; }
.time-display { display: flex; justify-content: space-between; font-size: 11px;
    color: var(--text-secondary); margin-bottom: 8px; font-variant-numeric: tabular-nums; }
.controls-row { display: flex; align-items: center; gap: 6px; justify-content: center; }
.ctrl-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--tag-bg);
    color: var(--text-primary); display: flex; align-items: center; justify-content: center; font-size: 15px; }
.ctrl-btn:hover { background: var(--accent); color: white; }
.ctrl-btn.play-btn { width: 48px; height: 48px; font-size: 20px;
    background: var(--accent-gradient); color: white; box-shadow: var(--shadow-md); }
.speed-control { display: flex; align-items: center; gap: 4px; margin-left: 10px;
    background: var(--tag-bg); border-radius: 18px; padding: 3px 8px; }

<script>
// ============================================
// 全局状态
// ============================================
const state = {
    mode: localStorage.getItem('pb_mode') || 'books', // 'books' | 'videos'
    books: [],
    videos: [],
    bookSeriesList: [],
    videoSeriesList: [],
    filtered: [],
    currentBook: null,
    currentVideo: null,
    currentPageIndex: 0,
    isPlaying: false,
    playbackSpeed: 1.0,
    videoPlaybackRate: 1.0,
    activeSeriesFilter: 'all',
    showFavoritesOnly: false,
    showRecentOnly: false,
    searchQuery: '',
    sortBy: 'default',
    // 持久化
    favorites: JSON.parse(localStorage.getItem('pb_favorites') || '[]'),      // 绘本收藏
    videoFavorites: JSON.parse(localStorage.getItem('pb_video_favorites') || '[]'),
    recentRead: JSON.parse(localStorage.getItem('pb_recent') || '[]'),
    recentVideos: JSON.parse(localStorage.getItem('pb_recent_videos') || '[]'),
    readingProgress: JSON.parse(localStorage.getItem('pb_progress') || '{}'),
    readStats: JSON.parse(localStorage.getItem('pb_read_stats') || '{}'),
    videoProgress: JSON.parse(localStorage.getItem('pb_video_progress') || '{}'),
    videoStats: JSON.parse(localStorage.getItem('pb_video_stats') || '{}'),
    theme: localStorage.getItem('pb_theme') || 'light',
};

// ============================================
// 工具函数
// ============================================
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const formatTime = (s) => { if (!s || isNaN(s)) return '0:00'; const m = Math.floor(s/60), sec = Math.floor(s%60); return m+':'+String(sec).padStart(2,'0'); };
const escapeHtml = (str) => { const d = document.createElement('div'); d.textContent = str ?? ''; return d.innerHTML; };
const encodePath = (fp) => fp ? fp.split('/').map(s => encodeURIComponent(s)).join('/') : '';
const debounce = (fn, d = 250) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), d); }; };
function formatDateTime(ts) {
    if (!ts) return '未知时间';
    const d = new Date(ts); if (isNaN(d.getTime())) return '未知时间';
    const p = n => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function showToast(msg, dur=2000) {
    const c = $('#toastContainer');
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    c.appendChild(t); requestAnimationFrame(() => t.classList.add('show'));
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, dur);
}

// ============================================
// 数据加载
// ============================================
async function fetchDataApi() {
    const errs = [];
    const [booksRes, videosRes] = await Promise.allSettled([
        fetch('books.json').then(r => r.ok ? r.json() : null).catch(e => { errs.push('books:' + e.message); return null; }),
        fetch('videos.json').then(r => r.ok ? r.json() : null).catch(e => { errs.push('videos:' + e.message); return null; }),
    ]);

    const booksData = booksRes.status === 'fulfilled' ? booksRes.value : null;
    const videosData = videosRes.status === 'fulfilled' ? videosRes.value : null;

    if (booksData) {
        state.books = booksData.books || [];
        state.bookSeriesList = Object.keys(booksData.series || {}).sort();
    }
    if (videosData) {
        state.videos = videosData.videos || [];
        state.videoSeriesList = Object.keys(videosData.series || {}).sort();
    }

    if (!booksData && !videosData) throw new Error('books.json 和 videos.json 都加载失败');
    return { booksData, videosData, errs };
}

async function loadAllData() {
    try {
        await fetchDataApi();
        migrateReadStatsFromProgress();
        updateStatsUI();
        renderHistoryPanel();
        renderSortOptions();
        applyFilters();
        renderFilters();
        updateFavBadge();
        hideLoading();
    } catch(e) {
        console.error('Load failed:', e);
        $('#loadingOverlay').innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-secondary)"><p style="font-size:18px;margin-bottom:10px">❌ 加载失败</p><small>' + escapeHtml(e.message) + '</small><br><br><button onclick="location.reload()" style="padding:8px 20px;border-radius:8px;border:none;background:var(--accent);color:white;cursor:pointer;">重新加载</button></div>';
    }
}

function hideLoading() {
    setTimeout(() => {
        $('#loadingOverlay').classList.add('hidden');
        setTimeout(() => $('#loadingOverlay').style.display = 'none', 400);
    }, 150);
}

// ============================================
// 模式切换
// ============================================
function switchMode(mode) {
    if (mode === state.mode) return;
    state.mode = mode;
    localStorage.setItem('pb_mode', mode);
    document.body.setAttribute('data-mode', mode);
    $$('.mode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
    state.activeSeriesFilter = 'all';
    state.showFavoritesOnly = false;
    state.showRecentOnly = false;
    state.searchQuery = '';
    state.sortBy = 'default';
    $('#searchInput').value = '';
    $('#favNavBtn').classList.remove('active');
    $('#recentNavBtn').classList.remove('active');
    // 先切换网格可见性，分批渲染需要按真实布局计算加载量
    $('#booksGrid').style.display = mode === 'books' ? 'grid' : 'none';
    $('#videosGrid').style.display = mode === 'videos' ? 'grid' : 'none';

function applyFilters(keepLoaded = false) {
    let results = [...getCurrentItems()];
    const favs = getCurrentFavorites();
    const recent = getCurrentRecent();

    if (state.activeSeriesFilter !== 'all') {
        results = results.filter(x => x.series === state.activeSeriesFilter);
    }
    if (state.showFavoritesOnly) {
        results = results.filter(x => favs.includes(x.folder));
    }
    if (state.showRecentOnly) {
        results = results.filter(x => recent.includes(x.folder));
        results.sort((a, b) => recent.indexOf(a.folder) - recent.indexOf(b.folder));
    } else {
        switch (state.sortBy) {
            case 'title-asc': results.sort((a, b) => a.title.localeCompare(b.title, 'zh')); break;
            case 'title-desc': results.sort((a, b) => b.title.localeCompare(a.title, 'zh')); break;
            case 'pages-desc': results.sort((a, b) => (b.pageCount||0) - (a.pageCount||0)); break;
            case 'pages-asc': results.sort((a, b) => (a.pageCount||0) - (b.pageCount||0)); break;
            case 'size-desc': results.sort((a, b) => (b.sizeMB||0) - (a.sizeMB||0)); break;
            case 'size-asc': results.sort((a, b) => (a.sizeMB||0) - (b.sizeMB||0)); break;
        }
    }
    if (state.searchQuery.trim()) {
        const q = state.searchQuery.trim().toLowerCase();
        results = results.filter(x =>
            (x.title || '').toLowerCase().includes(q) ||
            (x.series || '').toLowerCase().includes(q) ||
            (x.fileName || '').toLowerCase().includes(q)
        );
    }
    state.filtered = results;
    renderGrid(results, keepLoaded);
}

// 渲染 - 分批网格（滑到底部附近再追加下一批）
// ============================================
const GRID_BATCH = { books: 40, videos: 24 };
const GRID_PRELOAD_PX = 800;
const gridRender = { items: [], shown: 0, mode: 'books' };
let gridSentinelObserver = null;

function renderGrid(items, keepLoaded) {
    const mode = state.mode;
    const grid = mode === 'books' ? $('#booksGrid') : $('#videosGrid');
    const batch = GRID_BATCH[mode];
    const prevShown = gridRender.mode === mode ? gridRender.shown : 0;
    gridRender.items = items;
    gridRender.mode = mode;
    if (!items.length) {
        gridRender.shown = 0;
        grid.innerHTML = mode === 'books'
            ? '<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">没有找到匹配的绘本</div><div class="empty-desc">试试其他关键词或筛选条件吧</div></div>'
            : '<div class="empty-state"><div class="empty-icon">🎬</div><div class="empty-title">没有找到匹配的视频</div><div class="empty-desc">试试其他关键词或筛选条件吧</div></div>';
        return;
    }
    gridRender.shown = Math.min(items.length, keepLoaded ? Math.max(batch, prevShown) : batch);
    grid.innerHTML = gridCardsHtml(0, gridRender.shown);
    if (!keepLoaded) {
        const top = grid.getBoundingClientRect().top;
        if (top < 0) window.scrollTo(0, window.scrollY + top - 80);
    }
    if (mode === 'videos') setupVideoThumbLazyLoad();
    setupGridSentinel();
    fillGridToViewport();
}

function gridCardsHtml(from, to) {
    const cardHtml = gridRender.mode === 'books' ? bookCardHtml : videoCardHtml;
    return gridRender.items.slice(from, to).map((item, i) => cardHtml(item, i)).join('');
}

function appendGridBatch() {
    const { items, shown, mode } = gridRender;
    if (shown >= items.length || mode !== state.mode) return false;
    const grid = mode === 'books' ? $('#booksGrid') : $('#videosGrid');
    const next = Math.min(items.length, shown + GRID_BATCH[mode]);
    const firstNew = grid.children.length;
    grid.insertAdjacentHTML('beforeend', gridCardsHtml(shown, next));
    gridRender.shown = next;
    if (mode === 'videos') {
        [...grid.children].slice(firstNew).forEach(card => {
            const w = card.querySelector('.video-thumb-wrapper[data-video-src]');
            if (w) videoThumbObserver.observe(w);
        });
    }
    return true;
}

// IntersectionObserver 只在进出视口时触发，追加后哨兵仍可见时需手动继续补
function fillGridToViewport() {
    const sentinel = $('#gridSentinel');
    while (sentinel.getBoundingClientRect().top < window.innerHeight + GRID_PRELOAD_PX && appendGridBatch()) {}
}

function setupGridSentinel() {
    if (gridSentinelObserver) return;
    gridSentinelObserver = new IntersectionObserver(entries => {
        if (entries.some(e => e.isIntersecting)) fillGridToViewport();
    }, { rootMargin: `0px 0px ${GRID_PRELOAD_PX}px 0px` });
    gridSentinelObserver.observe($('#gridSentinel'));
}

// 懒加载视频缩略图：截取一帧存为小图后立即释放 <video>，避免移动端解码器/内存耗尽
let videoThumbObserver = null;
const isCoarsePointer = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
// 触屏设备并发解码 4K 极易耗尽内存，缩略图一次只解一个
const THUMB_CONCURRENCY = (isCoarsePointer || navigator.maxTouchPoints > 0) ? 1 : 2;
const THUMB_WIDTH = 320;
const THUMB_MAX_FILE_MB = 800;   // 超大文件不做缩略图，避免为截图下载/解码 4K 大文件
const THUMB_CACHE_LIMIT = 120;
let thumbLoadingCount = 0;
let thumbJobsPaused = false;
const thumbLoadQueue = [];
const videoThumbCache = new Map();
function processThumbQueue() {
    if (thumbJobsPaused) return;
    while (thumbLoadingCount < THUMB_CONCURRENCY && thumbLoadQueue.length) {
        // 后进先出：快速滑动时优先加载当前屏幕上的
        const task = thumbLoadQueue.pop();
        task();
    }
}
function showVideoThumb(wrapper, url) {
    const img = document.createElement('img');
    img.className = 'video-thumb';
    img.alt = '';
    img.src = url;
    wrapper.insertBefore(img, wrapper.firstChild);
    const placeholder = wrapper.querySelector('.video-thumb-placeholder');
    if (placeholder) placeholder.style.display = 'none';
}
function loadVideoThumb(wrapper) {
    if (wrapper.dataset.thumbLoaded) return;
    wrapper.dataset.thumbLoaded = '1';
    const src = wrapper.dataset.videoSrc;
    if (!src) return;
    if (videoThumbCache.has(src)) return showVideoThumb(wrapper, videoThumbCache.get(src));
    if ((+wrapper.dataset.videoSize || 0) > THUMB_MAX_FILE_MB) return;
    const run = () => {
        if (!wrapper.isConnected) return;
        thumbLoadingCount++;
        const video = document.createElement('video');
        video.muted = true;
        video.preload = 'metadata';
        video.playsInline = true;
        let done = false;
        let timer = null;
        const finish = () => {
            if (done) return;
            done = true;
            clearTimeout(timer);
            video.removeAttribute('src');
            video.load();
            thumbLoadingCount--;
            processThumbQueue();
        };
        const capture = () => {
            if (done || !video.videoWidth) return finish();
            try {
                const canvas = document.createElement('canvas');
                canvas.width = THUMB_WIDTH;
                canvas.height = Math.round(THUMB_WIDTH * video.videoHeight / video.videoWidth);
                canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                const url = canvas.toDataURL('image/jpeg', 0.75);
                videoThumbCache.set(src, url);
                if (videoThumbCache.size > THUMB_CACHE_LIMIT) {
                    videoThumbCache.delete(videoThumbCache.keys().next().value);
                }
                if (wrapper.isConnected) showVideoThumb(wrapper, url);
            } catch (e) {}
            finish();
        };
        // 视频开头多为白色片头，取稍后的画面
        video.addEventListener('loadedmetadata', () => {
            // 4K 视频不在后台解码截图，平板上很容易耗尽内存导致闪退
            if (video.videoWidth > 1920 || video.videoHeight > 1080) return finish();
            video.currentTime = Math.min(15, (video.duration || 2) / 2);
        }, { once: true });
        video.addEventListener('seeked', capture, { once: true });
        video.addEventListener('error', finish, { once: true });
        timer = setTimeout(finish, 10000);
        video.src = src;
    };
    thumbLoadQueue.push(run);
    processThumbQueue();
}
function setupVideoThumbLazyLoad() {
    if (videoThumbObserver) videoThumbObserver.disconnect();
    if (!('IntersectionObserver' in window)) {
        $$('.video-thumb-wrapper[data-video-src]').forEach(loadVideoThumb);
        return;
    }
    videoThumbObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                loadVideoThumb(entry.target);
                videoThumbObserver.unobserve(entry.target);
            }
        });
    }, { rootMargin: '200px' });
    $$('.video-thumb-wrapper[data-video-src]').forEach(el => videoThumbObserver.observe(el));
}

let screenWakeLock = null;
let screenWakeLockPending = false;
let screenWakeLockWarningShown = false;

function needsScreenWakeLock() {
    return document.visibilityState === 'visible' &&
        ($('#playerView').classList.contains('active') || $('#videoPlayerView').classList.contains('active'));
}

function showScreenWakeLockWarning() {
    if (screenWakeLockWarningShown) return;
    screenWakeLockWarningShown = true;
    showToast(window.isSecureContext
        ? '浏览器无法保持屏幕常亮，请在平板系统设置中调整休眠时间'
        : 'HTTP 局域网访问不支持网页常亮，请在平板系统设置中调整休眠时间', 6000);
}

async function syncScreenWakeLock() {
    if (!needsScreenWakeLock()) {
        const lock = screenWakeLock;
        screenWakeLock = null;
        if (lock && !lock.released) lock.release().catch(err => console.warn('[wake lock]', err));
        return;
    }
    if (screenWakeLock || screenWakeLockPending) return;
    if (!navigator.wakeLock) return showScreenWakeLockWarning();
    screenWakeLockPending = true;
    try {
        const lock = await navigator.wakeLock.request('screen');
        if (!needsScreenWakeLock()) {
            await lock.release();
            return;
        }
        screenWakeLock = lock;
        lock.addEventListener('release', () => {
            if (screenWakeLock === lock) screenWakeLock = null;
        });
    } catch (err) {
        console.warn('[wake lock]', err);
        if (needsScreenWakeLock()) showScreenWakeLockWarning();
    } finally {
        screenWakeLockPending = false;
    }
}

document.addEventListener('visibilitychange', syncScreenWakeLock);

const CONTROLS_HIDE_DELAY = 5000;
let immersiveTimer = null;
const IMMERSIVE_DELAY = 5000;

function openBook(folder) {
    const book = state.books.find(b => b.folder === folder);
    if (!book) return;
    state.currentBook = book;
    state.currentPageIndex = 0;
    state.recentRead = [folder].concat(state.recentRead.filter(f => f !== folder)).slice(0, 50);
    localStorage.setItem('pb_recent', JSON.stringify(state.recentRead));
    const saved = state.readingProgress[folder];
    if (saved && saved.page > 0) state.currentPageIndex = Math.min(saved.page, book.images.length - 1);
    trackBookOpened(book);

    $('#playerBookTitle').textContent = book.title;
    $('#playerSeriesName').textContent = book.series;
    updatePlayerFavBtn();

    const audioEl = $('#audioPlayer');
    audioEl.playbackRate = state.playbackSpeed;
    audioEl.src = book.audio ? encodePath(book.audio) : '';

    renderPageStrip(book);
    showPage(state.currentPageIndex);
    const pv = $('#playerView');
    pv.classList.add('active');
    pv.classList.remove('controls-hidden', 'immersive');
    $$('.stage-close-btn, .stage-fs-btn').forEach(btn => btn.style.opacity = '');
    autoNextEnabled = true;
    nextBookShown = false;
    hideNextBookToast();
    document.body.style.overflow = 'hidden';
    if (!isInFullscreen()) toggleBookFullscreen();
    syncScreenWakeLock();

    if (book.duration) $('#durationTime').textContent = formatTime(book.duration);
    audioEl.addEventListener('loadedmetadata', () => { $('#durationTime').textContent = formatTime(audioEl.duration); }, { once: true });

    if (book.audio) audioEl.play().catch(() => {});
    setupPlayerControlsAutohide();
}

function closePlayer() {
    const a = $('#audioPlayer'); a.pause();
    state.isPlaying = false; updatePlayButton();
    clearTimeout(controlsHideTimer); clearTimeout(immersiveTimer);
    const pv = $('#playerView');
    pv.classList.remove('active', 'controls-hidden', 'immersive');
    syncScreenWakeLock();
    $$('.stage-close-btn, .stage-fs-btn').forEach(btn => btn.style.opacity = '');

audio()?.addEventListener('play', () => { state.isPlaying = true; updatePlayButton(); resetControlsTimer(); startImmersiveTimer(); });

function enterImmersive() { const pv = $('#playerView'); pv.classList.add('immersive'); clearTimeout(immersiveTimer); $$('.stage-close-btn, .stage-fs-btn').forEach(btn => btn.style.opacity = '0'); pv.classList.remove('controls-hidden'); }
function exitImmersive() { const pv = $('#playerView'); pv.classList.remove('immersive'); $$('.stage-close-btn, .stage-fs-btn').forEach(btn => btn.style.opacity = ''); resetControlsTimer(); }

const videoEl = () => $('#videoEl');
let videoAutoNextEnabled = true;

function openVideo(folder) {
    const v = state.videos.find(x => x.folder === folder);
    if (!v) return;
    state.currentVideo = v;
    state.recentVideos = [folder].concat(state.recentVideos.filter(f => f !== folder)).slice(0, 50);
    localStorage.setItem('pb_recent_videos', JSON.stringify(state.recentVideos));
    trackVideoOpened(v);

    $('#vpTitle').textContent = v.title;
    $('#vpSeries').textContent = v.series || '';
    updateVideoFavBtn();

    const ve = videoEl();
    const src = encodePath(v.file);
    console.log('[video] 加载:', src);

    // 清理上次的事件监听
    ve.onerror = null;
    ve.onstalled = null;
    ve.oncanplay = null;

    ve.src = src;
    const prog = state.videoProgress[folder];
    ve.addEventListener('loadedmetadata', () => {
        if (prog && prog.currentTime && prog.duration && prog.currentTime < prog.duration - 3) {
            ve.currentTime = prog.currentTime;
        }
    }, { once: true });

    ve.onerror = () => {
        const err = ve.error;
        const map = { 1: '加载中止 (MEDIA_ERR_ABORTED)', 2: '网络错误 (MEDIA_ERR_NETWORK)', 3: '解码失败 (MEDIA_ERR_DECODE)', 4: '格式不支持或路径错误 (MEDIA_ERR_SRC_NOT_SUPPORTED)' };
        const msg = err ? (map[err.code] || '未知错误') : '加载失败';
        showToast('❌ 视频播放失败：' + msg, 4500);
        console.error('[video error]', err, 'src=', ve.currentSrc);
    };

    ve.playbackRate = state.videoPlaybackRate;

    const pv = $('#videoPlayerView');
    pv.classList.add('active');
    pv.classList.remove('hide-chrome');
    syncScreenWakeLock();
    document.body.style.overflow = 'hidden';
    videoAutoNextEnabled = true;
    thumbJobsPaused = true;

    renderVideoPlaylist();
    togglePlaylist(false);
    setupVideoPlayerAutohide();

    ve.play().catch(err => {
        console.warn('[video play rejected]', err);
    });

    // 触屏设备（尤其平板自带浏览器/WebView）自动全屏兼容性差，交给用户手动点全屏
    if (!isCoarsePointer) requestVideoFullscreen();
}

// 视频全屏
function isInFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
}
function requestVideoFullscreen() {
    if (isInFullscreen()) return;
    const pv = $('#videoPlayerView');
    const ve = videoEl();
    const target = pv || ve;
    const req = target.requestFullscreen || target.webkitRequestFullscreen || target.msRequestFullscreen;
    if (!req) return;
    try {
        const p = req.call(target);
        if (p && p.catch) p.catch(err => {
            console.warn('[fullscreen] 容器全屏失败，降级到 video:', err);
            const vreq = ve.requestFullscreen || ve.webkitRequestFullscreen || ve.msRequestFullscreen;
            if (vreq) { try { vreq.call(ve); } catch (e) {} }
        });
    } catch (e) {
        console.warn('[fullscreen] 请求异常:', e);
    }
}
function exitAnyFullscreen() {
    if (!isInFullscreen()) return;
    const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if (exit) { try { exit.call(document); } catch (e) {} }
}
function toggleVideoFullscreen() {
    if (isInFullscreen()) exitAnyFullscreen();
    else requestVideoFullscreen();
}
function toggleBookFullscreen() {
    if (isInFullscreen()) return exitAnyFullscreen();
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    const fallback = () => {
        if (!$('#playerView').classList.contains('active')) return;
        toggleImmersive();
        showToast('浏览器未允许全屏，已切换页内沉浸模式');
    };
    if (!req) return fallback();
    try {
        const p = req.call(el, { navigationUI: 'hide' });
        if (p && p.catch) p.catch(fallback);
    } catch (e) {
        fallback();
    }
}
function updateFullscreenBtn() {
    const title = isInFullscreen() ? '退出全屏 (F / Esc)' : '全屏 (F)';
    $$('#playerView button[onclick="toggleBookFullscreen()"], #vpFullscreenBtn').forEach(btn => {
        btn.title = title;
    });
}
['fullscreenchange', 'webkitfullscreenchange', 'msfullscreenchange'].forEach(ev => {

function getHistoryItems() {
    if (state.mode === 'books') {
        return state.books.map(book => ({ item: book, stat: state.readStats[book.folder], kind: 'book' }))
            .filter(x => x.stat && (x.stat.readCount || 0) > 0)
            .sort((a, b) => (b.stat.lastReadAt || 0) - (a.stat.lastReadAt || 0));
    }
    return state.videos.map(v => ({ item: v, stat: state.videoStats[v.folder], kind: 'video' }))
        .filter(x => x.stat && (x.stat.playCount || 0) > 0)
        .sort((a, b) => (b.stat.lastPlayAt || 0) - (a.stat.lastPlayAt || 0));
}
function renderHistoryPanel() {

        const tip = state.mode === 'books' ? '打开绘本后会自动记录进度和阅读次数' : '观看视频后会自动记录进度和观看次数';
        const icon = state.mode === 'books' ? '📚' : '🎬';
        container.innerHTML = `<div class="history-empty"><div style="font-size:36px">${icon}</div><div>还没有历史记录</div><small>${tip}</small></div>`;

    container.innerHTML = items.map(({ item, stat, kind }) => {

            return `
            <button class="history-item" onclick="openFromHistory('${item.folder}','book')">
                <div class="history-item-title">${escapeHtml(item.title)}</div>
                <div class="history-item-meta">

                    <span>读 ${stat.readCount || 0} 次</span>
                    <span>最近 ${formatDateTime(stat.lastReadAt)}</span>
                </div>
            </button>`;
        } else {
            const prog = state.videoProgress[item.folder];
            const pct = prog && prog.duration ? Math.round((prog.currentTime / prog.duration) * 100) : 0;
            return `
            <button class="history-item" onclick="openFromHistory('${item.folder}','video')">
                <div class="history-item-title">${escapeHtml(item.title)}</div>
                <div class="history-item-meta">

function toggleThemeMenu() { $('#themeDropdown').classList.toggle('show'); }
function closeThemeMenu() { $('#themeDropdown').classList.remove('show'); }
document.addEventListener('click', e => { if (!e.target.closest('.theme-switcher') && !e.target.closest('.theme-dropdown')) closeThemeMenu(); });

// ============================================
// 通用交互
// ============================================
function setSort(sortBy) { state.sortBy = sortBy; renderSortOptions(); applyFilters(); }
function goHome() {
    state.activeSeriesFilter = 'all';
    state.sortBy = 'default';
    state.showFavoritesOnly = false;
    state.showRecentOnly = false;
    state.searchQuery = '';
    $('#searchInput').value = '';
    $('#favNavBtn').classList.remove('active');
    $('#recentNavBtn').classList.remove('active');
    closeHistoryPanel();
    renderSortOptions();
    updateSeriesInputText();
    renderFilters();
    applyFilters();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}
function openRandomItem() {
    const pool = state.filtered.length ? state.filtered : getCurrentItems();
    if (!pool.length) return;
    const r = pool[Math.floor(Math.random() * pool.length)];
    showToast('🎲 为你推荐：' + r.title);
    if (state.mode === 'books') openBook(r.folder); else openVideo(r.folder);
}

$('#searchInput')?.addEventListener('input', e => debouncedSearch(e.target.value));

// 键盘快捷键
document.addEventListener('keydown', e => {
    if ($('#playerView').classList.contains('active')) {
        switch (e.key) {
            case 'Escape': closePlayer(); break;
            case 'ArrowLeft': prevPage(); break;
            case 'ArrowRight': nextPage(); break;
            case ' ': e.preventDefault(); togglePlay(); break;
            case 'f': case 'F': if (!e.ctrlKey && !e.metaKey) toggleBookFullscreen(); break;
        }
        return;
    }
    if ($('#videoPlayerView').classList.contains('active')) {
        const ve = videoEl();
        switch (e.key) {
            case 'Escape': closeVideoPlayer(); break;
            case ' ': e.preventDefault(); ve.paused ? ve.play() : ve.pause(); break;
            case 'ArrowLeft': ve.currentTime = Math.max(0, ve.currentTime - 5); break;
            case 'ArrowRight': ve.currentTime = Math.min(ve.duration || 99999, ve.currentTime + 5); break;
            case 'ArrowUp': e.preventDefault(); ve.volume = Math.min(1, ve.volume + 0.1); break;
            case 'ArrowDown': e.preventDefault(); ve.volume = Math.max(0, ve.volume - 0.1); break;
            case 'f': case 'F': if (!e.ctrlKey && !e.metaKey) { e.preventDefault(); toggleVideoFullscreen(); } break;
            case 'n': case 'N': playNextVideo(); break;
        }
    }
});

// 触摸滑动（绘本）
(function(){
    const stage = document.getElementById('playerStage');
    let sx, sy;
    stage.addEventListener('touchstart', e => { sx = e.changedTouches[0].screenX; sy = e.changedTouches[0].screenY; }, { passive: true });
    stage.addEventListener('touchend', e => {
        const ex = e.changedTouches[0].screenX, ey = e.changedTouches[0].screenY;
        const dx = ex - sx, dy = ey - sy;
        if (Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx)) return;
        if (dx > 0) prevPage(); else nextPage();
    }, { passive: true });
})();

// ============================================
// 初始化
// ============================================
(function init() {
    setTheme(state.theme);
    // 应用初始模式（需先设置 body data-mode，然后同步UI）
    document.body.setAttribute('data-mode', state.mode);
    $$('.mode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === state.mode));
    $('#booksGrid').style.display = state.mode === 'books' ? 'grid' : 'none';
    $('#videosGrid').style.display = state.mode === 'videos' ? 'grid' : 'none';
    $('#randomUnitLabel').textContent = state.mode === 'books' ? '本' : '个';
    updateHeroText();
    updateSearchPlaceholder();
    loadAllData();
})();
</script>
</body>
</html>
