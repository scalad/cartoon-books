<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 绘本世界 | Picture Book World</title>
<style>
/* ========================================
   CSS Variables & Theme System
   ======================================== */
:root {
    --bg-primary: #faf8f5;
    --bg-secondary: #ffffff;
    --bg-card: #ffffff;
    --text-primary: #2d2a26;
    --text-secondary: #6b6560;
    --text-muted: #9b9590;
    --border-color: rgba(0,0,0,0.06);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.12);
    --shadow-glow: 0 0 30px rgba(255,180,100,0.15);
    --accent: #e8723c;
    --accent-light: #ffeedd;
    --accent-gradient: linear-gradient(135deg, #e8723c 0%, #f0a05c 100%);
    --glass-bg: rgba(255,255,255,0.75);
    --glass-border: rgba(255,255,255,0.3);
    --nav-bg: rgba(250,248,245,0.92);
    --overlay-bg: rgba(0,0,0,0.4);
    --player-bg: linear-gradient(180deg, #fefcf9 0%, #f8f4ef 100%);
    --tag-bg: #f0ebe5;
    --tag-text: #7a6f68;
    --scrollbar-thumb: rgba(0,0,0,0.15);
    --progress-bg: rgba(0,0,0,0.06);
    --page-shadow: rgba(0,0,0,0.15);
}

[data-theme="dark"] {
    --bg-primary: #1a1915;
    --bg-secondary: #252320;
    --bg-card: #2d2a26;
    --text-primary: #f0ebe3;
    --text-secondary: #a89f95;
    --text-muted: #6b6560;
    --border-color: rgba(255,255,255,0.07);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.2);
    --shadow-md: 0 4px 20px rgba(0,0,0,0.3);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.4);
    --shadow-glow: 0 0 30px rgba(232,114,60,0.1);
    --accent: #f08850;
    --accent-light: #3d2818;
    --accent-gradient: linear-gradient(135deg, #f08850 0%, #f0a05c 100%);
    --glass-bg: rgba(37,35,32,0.85);
    --glass-border: rgba(255,255,255,0.08);
    --nav-bg: rgba(26,25,21,0.94);
    --overlay-bg: rgba(0,0,0,0.6);
    --player-bg: linear-gradient(180deg, #252320 0%, #1a1915 100%);
    --tag-bg: #3d3832;
    --tag-text: #a89f95;
    --scrollbar-thumb: rgba(255,255,255,0.15);
    --progress-bg: rgba(255,255,255,0.08);
    --page-shadow: rgba(0,0,0,0.4);
}

[data-theme="sepia"] {
    --bg-primary: #f5efe6;
    --bg-secondary: #fdf8ee;
    --bg-card: #fffdf8;
    --text-primary: #433422;
    --text-secondary: #6b5a45;
    --text-muted: #8c7a63;
    --border-color: rgba(139,109,66,0.12);
    --shadow-sm: 0 2px 8px rgba(139,109,66,0.06);
    --shadow-md: 0 4px 20px rgba(139,109,66,0.1);
    --shadow-lg: 0 8px 40px rgba(139,109,66,0.15);
    --accent: #c47a3a;
    --accent-light: #f5e6d3;
    --accent-gradient: linear-gradient(135deg, #b86e30 0%, #d4944a 100%);
    --glass-bg: rgba(253,248,238,0.82);
    --glass-border: rgba(200,170,120,0.2);
    --nav-bg: rgba(245,239,230,0.93);
    --player-bg: linear-gradient(180deg, #fdf8ee 0%, #f5efe6 100%);
    --tag-bg: #ede3d4;
    --tag-text: #7a6345;
}

/* ========================================
   Reset & Base
   ======================================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; }

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg-primary); color: var(--text-primary);
    line-height: 1.6; min-height: 100vh;
    transition: background 0.4s ease, color 0.3s ease;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ========================================
   Navigation
   ======================================== */
.navbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
    height: 58px;
    background: var(--nav-bg);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid var(--border-color);
    display: flex; align-items: center; padding: 0 24px;
}

.nav-brand {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none; color: var(--text-primary); cursor: pointer;
}
.nav-brand .logo-icon { font-size: 24px; }
.nav-brand h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
.nav-brand .logo-accent { color: var(--accent); }

.nav-center { flex: 1; display: flex; justify-content: center; padding: 0 16px; }
.nav-search { position: relative; width: 100%; max-width: 420px; }
.nav-search input {
    width: 100%; height: 38px; border-radius: 19px;
    border: 1.5px solid var(--border-color); background: var(--bg-secondary);
    padding: 0 40px 0 16px; font-size: 13px; color: var(--text-primary);
    outline: none; transition: all 0.25s ease; font-family: inherit;
}
.nav-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(232,114,60,0.1); }
.nav-search input::placeholder { color: var(--text-muted); }
.search-icon { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; font-size: 14px; }

.nav-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.nav-btn {
    width: 34px; height: 34px; border-radius: 8px;
    border: none; background: transparent; color: var(--text-secondary);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 16px; transition: all 0.2s ease; position: relative;
}
.nav-btn:hover { background: var(--tag-bg); transform: scale(1.05); }
.nav-btn.active { color: var(--accent); }
.badge-count {
    position: absolute; top: 2px; right: 2px;
    min-width: 14px; height: 14px; border-radius: 7px;
    background: var(--accent); color: white;
    font-size: 9px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; padding: 0 3px;
}

.theme-switcher { position: relative; overflow: visible !important; }
.theme-dropdown {
    display: none; position: absolute; top: calc(100% + 6px); right: 0;
    background: var(--bg-card); border: 1px solid var(--border-color);
    border-radius: 12px; padding: 5px; min-width: 130px;
    box-shadow: var(--shadow-lg); z-index: 100; animation: dropIn 0.2s ease;
}
.theme-dropdown.show { display: block; }
.theme-option {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text-secondary);
    transition: all 0.15s; border: none; background: none; width: 100%; font-family: inherit;
}
.theme-option:hover { background: var(--tag-bg); }
.theme-option.active { color: var(--accent); font-weight: 500; }
.theme-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border-color); flex-shrink: 0; }
.theme-dot.light { background: #faf8f5; }
.theme-dot.dark { background: #1a1915; }
.theme-dot.sepia { background: #f5efe6; }

@keyframes dropIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

/* ========================================
   Main Content Area
   ======================================== */
.main-content { padding-top: 68px; padding-bottom: 32px; min-height: 100vh; }
.container { max-width: 1280px; margin: 0 auto; padding: 0 20px; }

/* Hero Section */
.hero-section { text-align: center; padding: 18px 0 14px; animation: fadeInUp 0.5s ease; }
.hero-title { font-size: 26px; font-weight: 800; letter-spacing: -1px; margin-bottom: 6px; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.hero-subtitle { font-size: 13px; color: var(--text-secondary); max-width: 480px; margin: 0 auto; }
.hero-stats { display: flex; justify-content: center; gap: 20px; margin-top: 12px; }

/* 行内统计信息（与筛选栏同行） */
.stats-inline {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--text-secondary);
    white-space: nowrap;
}
.stat-inline strong {
    color: var(--accent);
    font-weight: 700;
    font-size: 15px;
}
.stat-divider {
    width: 1px;
    height: 14px;
    background: var(--border-color);
}

@keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

/* Filter Bar - 筛选+排序 同一行，排序靠右 */
.filter-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-bottom: 10px; flex-wrap: wrap;
}
.filter-bar .filter-label { font-size: 13px; color: var(--text-muted); white-space: nowrap; display: flex; align-items: center; gap: 4px; }
.filter-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.series-dropdown-wrapper { position: relative; }
.series-dropdown-input {
    width: 200px; height: 34px; border-radius: 8px;
    border: 1.5px solid var(--border-color); background: var(--bg-secondary);
    padding: 0 32px 0 12px; font-size: 13px; color: var(--text-primary);
    outline: none; transition: all 0.25s; cursor: pointer; font-family: inherit;
}
.series-dropdown-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(232,114,60,0.1); }
.dropdown-arrow { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--text-muted); font-size: 10px; }
.series-dropdown-list {
    display: none; position: absolute; top: calc(100% + 4px); left: 0;
    width: 100%; max-height: 300px; overflow-y: auto;
    background: var(--bg-card); border: 1px solid var(--border-color);
    border-radius: 10px; box-shadow: var(--shadow-lg); z-index: 100;
    padding: 5px; animation: dropIn 0.2s ease;
}
.series-dropdown-list.show { display: block; }
.series-option {
    padding: 7px 12px; border-radius: 6px; cursor: pointer;
    font-size: 12px; color: var(--text-secondary); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
    transition: all 0.15s; border: none; background: none;
    width: 100%; text-align: left; font-family: inherit; line-height: 1.35;
}
.series-option:hover { background: var(--tag-bg); }
.series-option.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
.series-option .opt-count { float: right; font-size: 11px; color: var(--text-muted); font-weight: normal; margin-left: 8px; }

/* ========================================
   BOOK GRID - 核心布局（严格上下排列）
   ======================================== */
.books-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 18px;
    animation: fadeInUp 0.5s ease 0.15s backwards;
}

/* 卡片容器 - 使用block确保子元素上下堆叠 */
.book-card {
    border-radius: 10px;
    overflow: hidden;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    animation: cardAppear 0.45s ease backwards;
}
.book-card:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: var(--shadow-lg), var(--shadow-glow);
    border-color: rgba(232,114,60,0.2);
}
.book-card:active { transform: translateY(-2px) scale(0.98); }

@keyframes cardAppear { from { opacity: 0; transform: translateY(20px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }

/* 封面图片区域 - 占据卡片全宽 */
.card-cover-wrapper { width: 100%; aspect-ratio: 3/4; overflow: hidden; background: var(--tag-bg); position: relative; }
.card-cover { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
.book-card:hover .card-cover { transform: scale(1.05); }

.card-fav-btn {
    position: absolute; top: 8px; right: 8px;
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(255,255,255,0.88); backdrop-filter: blur(8px);
    border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 14px; opacity: 0; transform: scale(0.8);
    transition: all 0.2s ease; color: var(--text-muted);
}
.book-card:hover .card-fav-btn { opacity: 1; transform: scale(1); }
.card-fav-btn.favorited { opacity: 1; color: #e74c3c; background: rgba(255,255,255,0.95); }

.card-series-tag {
    position: absolute; bottom: 8px; left: 8px;
    padding: 3px 8px; border-radius: 6px;
    background: rgba(0,0,0,0.55); backdrop-filter: blur(8px);
    color: white; font-size: 10px; font-weight: 500;
    max-width: calc(100% - 48px);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* 书籍信息区域 - 在封面下方，占据卡片全宽 */
.card-info { padding: 10px 12px 12px; width: 100%; box-sizing: border-box; }
.card-title {
    font-size: 13px; font-weight: 600; line-height: 1.4;
    max-height: 2.8em; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    margin-bottom: 4px; color: var(--text-primary);
}
.card-meta { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text-muted); }
.card-pages { display: flex; align-items: center; gap: 3px; }
.card-audio-icon { font-size: 12px; }

/* Empty State */
.empty-state { text-align: center; padding: 60px 20px; grid-column: 1 / -1; }
.empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.4; }
.empty-title { font-size: 18px; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
.empty-desc { font-size: 13px; color: var(--text-muted); }

/* Loading */
.loading-overlay {
    position: fixed; inset: 0; z-index: 9999;
    background: var(--bg-primary);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.5s ease;
}
.loading-overlay.hidden { opacity: 0; pointer-events: none; }
.loading-spinner { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--border-color); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
.loading-text { margin-top: 12px; font-size: 13px; color: var(--text-muted); }
@keyframes spin { to { transform: rotate(360deg); } }

/* Sort bar - 已合并到filter-bar，保留基础样式 */
.sort-bar { display: none; }
.sort-label { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
.sort-options { display: flex; gap: 3px; flex-wrap: wrap; }
.sort-btn { padding: 4px 10px; border-radius: 12px; border: 1px solid var(--border-color); background: transparent; font-size: 11px; color: var(--text-secondary); cursor: pointer; transition: all 0.2s; font-family: inherit; white-space: nowrap; }
.sort-btn:hover { border-color: var(--accent); color: var(--accent); }
.sort-btn.active { background: var(--tag-bg); color: var(--accent); border-color: transparent; }

.random-pick-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 14px; border-radius: 14px;
    border: none; background: var(--accent-gradient);
    color: white; font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all 0.25s;
    box-shadow: 0 2px 8px rgba(232,114,60,0.3);
    font-family: inherit; margin-top: 2px;
}
.random-pick-btn:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 4px 14px rgba(232,114,60,0.4); }

/* Toast */
.toast-container { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 2000; pointer-events: none; }
.toast { padding: 8px 20px; border-radius: 10px; background: var(--bg-card); border: 1px solid var(--border-color); box-shadow: var(--shadow-lg); font-size: 13px; color: var(--text-primary); opacity: 0; transform: translateY(-10px) scale(0.95); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: auto; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateY(0) scale(1); }

/* Player View */
.player-view { display: none; position: fixed; inset: 0; z-index: 900; background: var(--bg-primary); animation: playerIn 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
.player-view.active { display: flex; flex-direction: column; }

@keyframes playerIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }

.player-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; background: var(--nav-bg); backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border-color); flex-shrink: 0;
}
.player-back { display: flex; align-items: center; gap: 6px; background: none; border: none; color: var(--text-primary); font-size: 14px; cursor: pointer; padding: 6px 12px; border-radius: 8px; font-family: inherit; transition: all 0.2s; }
.player-back:hover { background: var(--tag-bg); }
.player-title-area { flex: 1; text-align: center; }
.player-book-title { font-size: 15px; font-weight: 600; }
.player-series { font-size: 11px; color: var(--text-muted); }
.player-actions { display: flex; gap: 4px; }
.p-action-btn {
    width: 32px; height: 32px; border-radius: 8px;
    border: 1px solid var(--border-color); background: var(--bg-secondary);
    color: var(--text-secondary); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; transition: all 0.2s; font-family: inherit;
}
.p-action-btn:hover { background: var(--tag-bg); }
.p-action-btn.fav-active { color: #e74c3c; }

.player-stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px 24px; overflow: hidden; position: relative; background: var(--player-bg); transition: padding 0.4s ease; }
.player-view.controls-hidden .player-stage { padding: 8px 24px; }
.page-container { position: relative; max-width: 92%; max-height: 94%; width: 100%; height: 100%; perspective: 1500px; display: flex; align-items: center; justify-content: center; }
.page-image-wrapper { position: relative; width: 100%; height: 100%; border-radius: 10px; overflow: hidden; box-shadow: var(--shadow-lg), 0 0 50px rgba(0,0,0,0.06); animation: pageEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
.page-image-wrapper.flip-out { animation: pageFlipOut 0.35s ease forwards; }
.page-image-wrapper.flip-in { animation: pageFlipIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
@keyframes pageFlipOut { to { transform: rotateY(-90deg); opacity: 0; } }
@keyframes pageFlipIn { from { transform: rotateY(90deg); opacity: 0; } to { transform: rotateY(0); opacity: 1; } }
@keyframes pageEnter { from { opacity: 0; transform: scale(0.95) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.page-image { width: 100%; height: 100%; display: block; object-fit: contain; background: var(--tag-bg); }
.page-indicator { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); padding: 4px 14px; border-radius: 16px; background: rgba(0,0,0,0.55); backdrop-filter: blur(8px); color: white; font-size: 11px; font-weight: 500; }

.page-strip { display: flex; gap: 5px; justify-content: center; padding: 8px 20px; background: var(--nav-bg); border-top: 1px solid var(--border-color); overflow-x: auto; flex-shrink: 0; -ms-overflow-style: none; scrollbar-width: none; }
.page-strip::-webkit-scrollbar { display: none; }
.strip-thumb { width: 44px; height: 58px; border-radius: 5px; object-fit: cover; cursor: pointer; border: 2px solid transparent; opacity: 0.5; transition: all 0.2s; flex-shrink: 0; }
.strip-thumb:hover { opacity: 0.8; transform: scale(1.06); }
.strip-thumb.active { border-color: var(--accent); opacity: 1; box-shadow: 0 2px 6px rgba(232,114,60,0.3); }

.player-controls { padding: 12px 20px 18px; background: var(--nav-bg); border-top: 1px solid var(--border-color); flex-shrink: 0; }
.progress-container { width: 100%; margin-bottom: 10px; cursor: pointer; }
.progress-bar { width: 100%; height: 5px; border-radius: 3px; background: var(--progress-bg); position: relative; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; background: var(--accent-gradient); transition: width 0.1s linear; position: relative; }
.progress-fill::after { content: ''; position: absolute; right: -5px; top: -2.5px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 5px rgba(232,114,60,0.4); opacity: 0; transition: opacity 0.2s; }
.progress-container:hover .progress-fill::after { opacity: 1; }

.time-display { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-bottom: 10px; font-variant-numeric: tabular-nums; }
.controls-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
.ctrl-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: transparent; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: all 0.2s; font-family: inherit; }
.ctrl-btn:hover { background: var(--tag-bg); transform: scale(1.08); }
.ctrl-btn.play-btn { width: 52px; height: 52px; font-size: 22px; background: var(--accent-gradient); color: white; box-shadow: 0 3px 14px rgba(232,114,60,0.35); }
.ctrl-btn.play-btn:hover { transform: scale(1.08); box-shadow: 0 5px 20px rgba(232,114,60,0.45); }

.speed-control { display: flex; align-items: center; gap: 3px; margin-left: 6px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-secondary); }
.speed-control button { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 12px; font-weight: 600; padding: 1px 5px; font-family: inherit; }
.speed-control button:hover { color: var(--accent); }
.speed-control .speed-val { font-size: 11px; color: var(--text-primary); font-weight: 600; min-width: 32px; text-align: center; }

/* 关闭按钮 - 始终可见，不受控件隐藏影响 */
.stage-close-btn {
    position: absolute; top: 12px; right: 12px;
    width: 38px; height: 38px; border-radius: 50%;
    background: rgba(0,0,0,0.45); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15); color: #fff;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 300; letter-spacing: -1px;
    transition: all 0.25s ease; z-index: 20;
}
.stage-close-btn:hover { background: rgba(220,53,69,0.85); transform: scale(1.08); border-color: transparent; }
.player-view.fullscreen .stage-close-btn {
    background: rgba(0,0,0,0.55); border-color: rgba(255,255,255,0.2);
}

/* 沉浸模式按钮 - 始终可见 */
.stage-fs-btn {
    position: absolute; top: 56px; right: 12px;
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(0,0,0,0.4); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.12); color: #fff;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    transition: all 0.25s ease; z-index: 20;
}
.stage-fs-btn:hover { background: rgba(232,114,60,0.8); transform: scale(1.08); border-color: transparent; }
.player-view.immersive .stage-fs-btn { display: none; }

/* 沉浸模式 - 图片填满整个屏幕 */
.player-view.immersive {
    background: #000 !important;
}
.player-view.immersive .player-header,
.player-view.immersive .player-controls,
.player-view.immersive .page-strip {
    display: none !important;
    height: 0 !important;
    padding: 0 !important;
    margin: 0 !important;
    overflow: hidden !important;
    border-color: transparent !important;
}
.player-view.immersive .player-stage {
    padding: 0 !important;
}

.stage-nav-left, .stage-nav-right {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(255,255,255,0.85); backdrop-filter: blur(10px);
    border: 1px solid var(--border-color); color: var(--text-primary); font-size: 18px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; z-index: 10; opacity: 0;
}
.player-stage:hover .stage-nav-left, .player-stage:hover .stage-nav-right { opacity: 1; }
.stage-nav-left { left: 12px; }
.stage-nav-right { right: 12px; }
.stage-nav-left:hover, .stage-nav-right:hover { background: white; transform: translateY(-50%) scale(1.08); box-shadow: var(--shadow-md); }

.player-view.fullscreen { position: fixed; inset: 0; z-index: 10000; background: #000; }
.player-view.fullscreen .player-header, .player-view.fullscreen .player-controls, .player-view.fullscreen .page-strip { background: rgba(0,0,0,0.7); border-color: rgba(255,255,255,0.1); }
.player-view.fullscreen .player-back, .player-view.fullscreen .p-action-btn, .player-view.fullscreen .time-display, .player-view.fullscreen .speed-control { color: #ccc; }
.player-view.fullscreen .player-book-title { color: #fff; }
.player-view.fullscreen .player-stage { background: #000; }

/* 控件自动隐藏 - 隐藏时释放空间让图片放大 */
.player-view .player-header,
.player-view .page-strip,
.player-view .player-controls {
    transition: opacity 0.4s ease, transform 0.4s ease,
                height 0.4s ease, padding 0.4s ease, margin 0.4s ease,
                border-color 0.4s ease;
    flex-shrink: 0;
    overflow: hidden;
}
.player-view.controls-hidden .player-header {
    opacity: 0; transform: translateY(-100%); pointer-events: none;
    height: 0 !important; padding: 0 !important; margin: 0 !important; border-bottom-color: transparent;
}
.player-view.controls-hidden .player-controls {
    opacity: 0; transform: translateY(100%); pointer-events: none;
    height: 0 !important; padding: 0 !important; margin: 0 !important; border-top-color: transparent;
}
.player-view.controls-hidden .page-strip {
    opacity: 0; pointer-events: none;
    height: 0 !important; padding: 0 !important; border-top-color: transparent;
}
.player-view .stage-nav-left,
.player-view .stage-nav-right {
    transition: opacity 0.3s ease;
}
.player-view.controls-hidden .stage-nav-left,
.player-view.controls-hidden .stage-nav-right { opacity: 0 !important; pointer-events: none; }

/* 即将播放下一本 提示 - 顶部显示 */
.next-book-toast {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 9999;
    display: flex; align-items: flex-start; justify-content: center;
    pointer-events: none; opacity: 0;
    transform: translateY(-20px);
    transition: opacity 0.5s ease, transform 0.5s ease;
}
.next-book-toast.show { opacity: 1; transform: translateY(0); }
.next-book-toast-inner {
    background: rgba(232,114,60,0.95);
    color: white;
    padding: 12px 24px;
    border-radius: 0 0 16px 16px;
    font-size: 14px;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 4px 24px rgba(232,114,60,0.4);
    pointer-events: auto;
    max-width: 90%;
    animation: nextToastPulse 2s infinite ease-in-out;
}
.next-book-icon { font-size: 22px; }
.next-book-toast-inner strong { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.next-book-cancel {
    margin-left: 8px;
    padding: 4px 12px;
    border-radius: 10px;
    border: 1.5px solid rgba(255,255,255,0.4);
    background: transparent;
    color: white;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    font-family: inherit;
    transition: all 0.2s;
    white-space: nowrap;
}
.next-book-cancel:hover { background: rgba(255,255,255,0.2); }
@keyframes nextToastPulse {
    0%, 100% { box-shadow: 0 4px 24px rgba(232,114,60,0.4); }
    50% { box-shadow: 0 4px 36px rgba(232,114,60,0.6); }
}

/* Responsive */
@media (max-width: 768px) {
    .navbar { padding: 0 14px; height: 52px; }
    .nav-brand h1 { font-size: 16px; }
    .nav-brand .logo-icon { font-size: 22px; }
    .nav-search input { height: 34px; font-size: 12px; }
    .main-content { padding-top: 60px; }
    .hero-section { padding: 14px 0 10px; }
    .hero-title { font-size: 20px; }
    .stats-inline { font-size: 12px; gap: 6px; }
    .stats-inline strong { font-size: 13px; }
    .series-dropdown-input { width: 150px; height: 32px; font-size: 12px; }
    .sort-btn { padding: 4px 8px; font-size: 10px; }
    .books-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; }
    .container { padding: 0 14px; }
    .filter-bar { gap: 8px; }
    .filter-left { gap: 8px; }
    .series-dropdown-input { width: 160px; height: 32px; font-size: 12px; }
    .sort-btn { font-size: 10px; padding: 3px 8px; }
    .player-header { padding: 10px 14px; }
    .player-stage { padding: 10px; }
    .page-strip { padding: 6px 10px; }
    .strip-thumb { width: 36px; height: 48px; }
    .ctrl-btn { width: 36px; height: 36px; font-size: 16px; }
    .ctrl-btn.play-btn { width: 46px; height: 46px; font-size: 20px; }
    .player-controls { padding: 10px 14px 14px; }
    .stage-nav-left, .stage-nav-right { width: 36px; height: 36px; font-size: 14px; }
}

@media (max-width: 600px) {
    .filter-bar { flex-direction: column; align-items: stretch; gap: 8px; }
    .filter-left { justify-content: flex-start; }

}

    .card-title { font-size: 12px; }
    .nav-center { padding: 0 6px; }
}
</style>
</head>
<body data-theme="light">

<!-- Loading Overlay -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">正在加载绘本数据...</div>
</div>

<!-- Navbar -->
<nav class="navbar" id="navbar">
    <a class="nav-brand" onclick="goHome()">
        <span class="logo-icon">📖</span>
        <h1>绘本<span class="logo-accent">世界</span></h1>
    </a>
    <div class="nav-center">
        <div class="nav-search"><input type="text" id="searchInput" placeholder="搜索绘本标题、系列..." autocomplete="off"><span class="search-icon">🔍</span></div>
    </div>
    <div class="nav-actions">
        <button class="nav-btn" id="favNavBtn" onclick="toggleFavFilter()" title="我的收藏">❤️<span class="badge-count" id="favBadgeCount" style="display:none">0</span></button>
        <button class="nav-btn" id="recentNavBtn" onclick="toggleRecentFilter()" title="最近阅读">🕐</button>
        <button class="nav-btn theme-switcher" onclick="toggleThemeMenu()" title="切换主题">🌙</button>
        <div class="theme-dropdown" id="themeDropdown">
            <button class="theme-option active" data-theme="light" onclick="setTheme('light')"><span class="theme-dot light"></span>亮色模式</button>
            <button class="theme-option" data-theme="dark" onclick="setTheme('dark')"><span class="theme-dot dark"></span>暗色模式</button>
            <button class="theme-option" data-theme="sepia" onclick="setTheme('sepia')"><span class="theme-dot sepia"></span>护眼模式</button>
        </div>
    </div>
</nav>

<!-- Main Content -->
<main class="main-content" id="mainContent">
    <div class="container">
        <!-- Hero -->
        <!-- Hero -->
        <section class="hero-section" id="heroSection">
            <h2 class="hero-title">探索精彩绘本世界</h2>
            <p class="hero-subtitle">精选中文绘本，涵盖凯迪克金奖、二十四节气等经典系列，开启亲子阅读之旅</p>
        </section>

        <!-- Stats + Filter + Sort 同一行 -->
        <div class="filter-bar" id="filterBar">
            <div class="filter-left">
                <div class="stats-inline">
                    <span class="stat-inline"><strong id="totalBooksCount">0</strong> 本绘本</span>
                    <span class="stat-divider"></span>
                    <span class="stat-inline"><strong id="totalSeriesCount">0</strong> 个系列</span>
                    <span class="stat-divider"></span>
                    <span class="stat-inline"><strong id="audioBooksCount">0</strong> 带音频</span>
                </div>
                <span class="filter-label">📂 系列：</span>
                <div class="series-dropdown-wrapper">
                    <input type="text" class="series-dropdown-input" id="seriesInput" placeholder="搜索或选择系列..." autocomplete="off" onclick="toggleSeriesDropdown()" onfocus="toggleSeriesDropdown()" oninput="onSeriesInput(this.value)">
                    <span class="dropdown-arrow">▼</span>
                    <div class="series-dropdown-list" id="seriesList"></div>
                </div>
            </div>
            <div class="sort-options">
                <button class="sort-btn active" data-sort="default" onclick="setSort('default')">默认排序</button>
                <button class="sort-btn" data-sort="title-asc" onclick="setSort('title-asc')">标题↑</button>
                <button class="sort-btn" data-sort="title-desc" onclick="setSort('title-desc')">标题↓</button>
                <button class="sort-btn" data-sort="pages-desc" onclick="setSort('pages-desc')">页数多→少</button>
                <button class="sort-btn" data-sort="pages-asc" onclick="setSort('pages-asc')">页数少→多</button>
            </div>
        </div>
        <div style="text-align:center"><button class="random-pick-btn" onclick="openRandomBook()">🎲 随机推荐一本</button></div>

        <!-- Books Grid -->
        <div class="books-grid" id="booksGrid"></div>
    </div>
</main>

<!-- Player -->
<div class="player-view" id="playerView">
    <header class="player-header">
        <button class="player-back" onclick="closePlayer()">← 返回</button>
        <div class="player-title-area">
            <div class="player-book-title" id="playerBookTitle"></div>
            <div class="player-series" id="playerSeriesName"></div>
        </div>
        <div class="player-actions">
            <button class="p-action-btn" id="playerFavBtn" onclick="togglePlayerFav()" title="收藏">♡</button>
            <button class="p-action-btn" onclick="toggleImmersive()" title="沉浸模式">⛶</button>
        </div>
    </header>
    <div class="player-stage" id="playerStage">
        <button class="stage-close-btn" onclick="closePlayer()" title="关闭返回首页">✕</button>
        <button class="stage-fs-btn" onclick="toggleImmersive()" title="沉浸模式">⛶</button>
        <button class="stage-nav-left" onclick="prevPage()">◀</button>
        <div class="page-container">
            <div class="page-image-wrapper" id="pageImageWrapper"><img class="page-image" id="pageImage" src="" alt=""></div>
            <div class="page-indicator" id="pageIndicator">1 / 20</div>

    </div>
    <div class="page-strip" id="pageStrip"></div>
    <div class="player-controls">
        <div class="progress-container" id="progressContainer"><div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div></div>
        <div class="time-display"><span id="currentTime">0:00</span><span id="durationTime">0:00</span></div>
        <div class="controls-row">
            <button class="ctrl-btn" onclick="skipBackward()" title="后退10秒">⏪</button>
            <button class="ctrl-btn" onclick="prevPage()" title="上一页">⏮</button>
            <button class="ctrl-btn play-btn" id="playBtn" onclick="togglePlay()" title="播放/暂停">▶</button>
            <button class="ctrl-btn" onclick="nextPage()" title="下一页">⏭</button>
            <button class="ctrl-btn" onclick="skipForward()" title="快进10秒">⏩</button>
            <div class="speed-control">
                <button onclick="changeSpeed(-0.25)">-</button><span class="speed-val" id="speedVal">1.0x</span><button onclick="changeSpeed(0.25)">+</button>
            </div>
        </div>
    </div>
</div>

<!-- 即将播放下一本 提示 - 放在player-view外面避免层叠上下文问题 -->
<div class="next-book-toast" id="nextBookToast">
    <div class="next-book-toast-inner">
        <span class="next-book-icon">⏭</span>
        <span>即将自动播放下一本：</span>
        <strong id="nextBookTitle"></strong>
        <button class="next-book-cancel" onclick="cancelAutoNext()">取消</button>
    </div>
</div>
<audio id="audioPlayer" preload="auto"></audio>
<div class="toast-container" id="toastContainer"></div>

<script>
// ============================================
// Config & State
// ============================================
const CONFIG = { BASE_URL: '', BOOKS_DATA_PATH: 'books.json' };

const state = {
    books: [], seriesList: [], filteredBooks: [], currentBook: null,
    currentPageIndex: 0, isPlaying: false, playbackSpeed: 1.0,
    activeSeriesFilter: 'all', showFavoritesOnly: false, showRecentOnly: false,
    searchQuery: '', sortBy: 'default',
    favorites: JSON.parse(localStorage.getItem('pb_favorites') || '[]'),
    recentRead: JSON.parse(localStorage.getItem('pb_recent') || '[]'),
    readingProgress: JSON.parse(localStorage.getItem('pb_progress') || '{}'),
    theme: localStorage.getItem('pb_theme') || 'light',
};

function $(sel) { return document.querySelector(sel); }
function $$(sel) { return [...document.querySelectorAll(sel)]; }
function formatTime(s) { if (!s || isNaN(s)) return '0:00'; const m = Math.floor(s/60), sec = Math.floor(s%60); return m+':'+String(sec).padStart(2,'0'); }
function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
function encodePath(fp) { return fp ? fp.split('/').map(s => encodeURIComponent(s)).join('/') : ''; }
function debounce(fn, d = 250) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), d); }; }

// Data Loading
async function loadBooksData() {
    try {
        const r = await fetch(CONFIG.BOOKS_DATA_PATH);
        if (!r.ok) throw new Error('HTTP '+r.status);
        const data = await r.json();
        state.books = data.books || [];
        state.seriesList = Object.keys(data.series || {}).sort();
        $('#totalBooksCount').textContent = state.books.length;
        $('#totalSeriesCount').textContent = state.seriesList.length;
        $('#audioBooksCount').textContent = state.books.filter(b => b.hasAudio).length;
        applyFilters(); renderFilters(); updateFavBadge(); hideLoading();
    } catch(e) {
        console.error('Load failed:', e);
        $('#loadingOverlay').innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-secondary)"><p style="font-size:18px;margin-bottom:10px">❌ 加载失败</p><small>请确认通过 HTTP 服务访问，且 books.json 存在</small><br><br><button onclick="location.reload()" style="padding:8px 20px;border-radius:8px;border:none;background:var(--accent);color:white;cursor:pointer;font-size:14px;">重新加载</button></div>';
    }
}
function hideLoading() { setTimeout(() => { $('#loadingOverlay').classList.add('hidden'); setTimeout(() => $('#loadingOverlay').style.display='none', 500); }, 200); }

// Filtering
function applyFilters() {
    let results = [...state.books];
    if (state.activeSeriesFilter !== 'all') results = results.filter(b => b.series === state.activeSeriesFilter);
    if (state.showFavoritesOnly) results = results.filter(b => state.favorites.includes(b.folder));
    if (state.showRecentOnly) {
        results = results.filter(b => state.recentRead.includes(b.folder));
        results.sort((a,b) => state.recentRead.indexOf(a.folder) - state.recentRead.indexOf(b.folder));
    } else {
        switch(state.sortBy) {
            case 'title-asc': results.sort((a,b)=>a.title.localeCompare(b.title,'zh')); break;
            case 'title-desc': results.sort((a,b)=>b.title.localeCompare(a.title,'zh')); break;
            case 'pages-desc': results.sort((a,b)=>b.pageCount-a.pageCount); break;
            case 'pages-asc': results.sort((a,b)=>a.pageCount-b.pageCount); break;
        }
    }
    if (state.searchQuery.trim()) {
        const q = state.searchQuery.trim().toLowerCase();
        results = results.filter(b => b.title.toLowerCase().includes(q) || b.series.toLowerCase().includes(q));
    }
    state.filteredBooks = results;
    renderBooksGrid(results);
}
const debouncedSearch = debounce((q) => { state.searchQuery=q; applyFilters(); }, 220);

// Render Functions
function renderFilters() {
    const list = $('#seriesList');
    let h = `<button class="series-option ${state.activeSeriesFilter==='all'?'active':''}" onclick="filterBySeries('all');closeSeriesDropdown()">🌐 全部系列 <span class="opt-count">${state.books.length}</span></button>`;
    state.seriesList.forEach(s => {
        const c = state.books.filter(b=>b.series===s).length;
        h += `<button class="series-option ${state.activeSeriesFilter===s?'active':''}" data-series="${escapeHtml(s)}" onclick="filterBySeries('${escapeHtml(s)}');closeSeriesDropdown()">${escapeHtml(s)} <span class="opt-count">${c}</span></button>`;
    });
    list.innerHTML = h; updateSeriesInputText();
}
function toggleSeriesDropdown() { $('#seriesList').classList.toggle('show'); }
function closeSeriesDropdown() { $('#seriesList').classList.remove('show'); }
function onSeriesInput(val) { $$('.series-option').forEach(o => { o.style.display = ((o.dataset.series||'').toLowerCase().includes(val.toLowerCase()) || val==='') ? '' : 'none'; }); }
function updateSeriesInputText() {
    const i = $('#seriesInput');
    if (state.activeSeriesFilter==='all' || !state.activeSeriesFilter) { i.placeholder='搜索或选择系列...'; i.value=''; }
    else i.value = state.activeSeriesFilter;
}
document.addEventListener('click', e => { if(!e.target.closest('.series-dropdown-wrapper')) closeSeriesDropdown(); });

// === BOOK GRID RENDERING - 严格上下布局 ===
function renderBooksGrid(books) {
    const grid = $('#booksGrid');
    if (!books.length) {
        grid.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">没有找到匹配的绘本</div><div class="empty-desc">试试其他关键词或筛选条件吧</div></div>';
        return;
    }
    // 每个卡片结构：<卡片块>[封面图区块][文字信息区块]</卡片块>
    grid.innerHTML = books.map((book, idx) => {
        const isFav = state.favorites.includes(book.folder);
        const progress = state.readingProgress[book.folder];
        const coverUrl = CONFIG.BASE_URL + encodePath(book.cover);
        return `
        <div class="book-card" style="animation-delay:${Math.min(idx*0.03,0.5)}s" onclick="openBook('${book.folder}')">
            <div class="card-cover-wrapper">
                <img class="card-cover" src="${coverUrl}" alt="${escapeHtml(book.title)}" loading="lazy"
                     onerror="this.parentElement.innerHTML='<div style=&quot;display:flex;align-items:center;justify-content:center;height:100%;font-size:36px;color:var(--text-muted)&quot;>📖</div>'">
                <button class="card-fav-btn ${isFav?'favorited':''}" onclick="event.stopPropagation();toggleFavorite('${book.folder}')" title="${isFav?'取消收藏':'添加收藏'}">${isFav?'❤️':'♡'}</button>
                ${book.series !== '其他' ? `<span class="card-series-tag">${escapeHtml(book.series)}</span>` : ''}
            </div>
            <div class="card-info">
                <div class="card-title">${escapeHtml(book.title)}</div>
                <div class="card-meta">
                    <span class="card-pages">📄 ${book.pageCount} 页</span>
                    ${book.hasAudio ? '<span class="card-audio-icon">🔊</span>' : ''}
                    ${progress ? `<span style="margin-left:auto;color:var(--accent);font-size:10px">已读 ${(progress.page||0)}/${book.pageCount}</span>` : ''}
                </div>
            </div>
        </div>`;
    }).join('');
}

// Player
let controlsHideTimer = null;
const CONTROLS_HIDE_DELAY = 5000; // 5秒后隐藏

function resetControlsTimer() {
    const pv = $('#playerView');
    if (!pv || !pv.classList.contains('active')) return;
    // 鼠标移动退出沉浸模式
    if (pv.classList.contains('immersive')) exitImmersive();
    pv.classList.remove('controls-hidden');
    clearTimeout(controlsHideTimer);
    clearTimeout(immersiveTimer);
    // 播放中：5秒后沉浸，同时控件隐藏
    if (state.isPlaying) {
        controlsHideTimer = setTimeout(() => {
            if ($('#playerView')?.classList.contains('active') && state.isPlaying) {
                $('#playerView')?.classList.add('controls-hidden');
                enterImmersive();
            }
        }, CONTROLS_HIDE_DELAY);
    }
}

// 判断鼠标是否在底部控制区域
function isMouseInControlArea(e) {
    const target = e.target;
    // 如果事件目标本身就是控件元素，直接触发
    if (target.closest('.player-controls, .page-strip, .player-header, .stage-nav-left, .stage-nav-right, .stage-close-btn, .stage-fs-btn, .next-book-toast-inner')) return true;
    // 否则检查Y坐标：底部80px范围内视为控制区
    const rect = $('#playerView').getBoundingClientRect();
    const y = e.clientY - rect.top;
    return y > rect.height - 80 || e.clientY < rect.top + 60; // 顶部也保留（header区域）
}

function setupPlayerControlsAutohide() {
    const pv = $('#playerView');
    if (!pv) return;
    pv.addEventListener('mousemove', (e) => {
        // 只有在控制区域（顶部/底部）才触发退出沉浸/重置定时器
        if (isMouseInControlArea(e)) resetControlsTimer();
    });
    pv.addEventListener('touchstart', () => { resetControlsTimer(); }, {passive: true});
}

function openBook(folder) {
    const book = state.books.find(b => b.folder === folder);
    if (!book) return;
    state.currentBook = book; state.currentPageIndex = 0;
    state.recentRead = [folder].concat(state.recentRead.filter(f => f!==folder)).slice(0,50);
    localStorage.setItem('pb_recent', JSON.stringify(state.recentRead));
    const saved = state.readingProgress[folder];
    if (saved && saved.page > 0) state.currentPageIndex = Math.min(saved.page, book.images.length - 1);

    $('#playerBookTitle').textContent = book.title;
    $('#playerSeriesName').textContent = book.series;
    updatePlayerFavBtn();

    const audioEl = $('#audioPlayer');
    audioEl.playbackRate = state.playbackSpeed;
    audioEl.src = book.audio ? CONFIG.BASE_URL + encodePath(book.audio) : '';

    renderPageStrip(book);
    showPage(state.currentPageIndex);
    const pv = $('#playerView');
    pv.classList.add('active');
    pv.classList.remove('controls-hidden', 'immersive');
    $$('.stage-close-btn, .stage-fs-btn').forEach(btn => btn.style.opacity = '');
    autoNextEnabled = true;
    nextBookShown = false;
    hideNextBookToast();
    $('body').style.overflow = 'hidden';

    if (book.duration) $('#durationTime').textContent = formatTime(book.duration);
    audioEl.addEventListener('loadedmetadata', () => { $('#durationTime').textContent = formatTime(audioEl.duration); }, {once:true});

    // 自动播放
    if (book.audio) {
        audioEl.play().catch(()=>{});
    }

    setupPlayerControlsAutohide();
}

function closePlayer() {
    const a = $('#audioPlayer'); a.pause();
    state.isPlaying = false; updatePlayButton();
    clearTimeout(controlsHideTimer);
    clearTimeout(immersiveTimer);
    const pv = $('#playerView');
    pv.classList.remove('active', 'fullscreen', 'controls-hidden', 'immersive');
    $$('.stage-close-btn, .stage-fs-btn').forEach(btn => btn.style.opacity = '');
    $('body').style.overflow = ''; saveReadingProgress();
    if (state.showRecentOnly) toggleRecentFilter();
    if (state.showFavoritesOnly) toggleFavFilter();
}

function renderPageStrip(book) {
    $('#pageStrip').innerHTML = book.images.map((img,i) =>
        `<img class="strip-thumb ${i===state.currentPageIndex?'active':''}" src="${CONFIG.BASE_URL+encodePath(img.file)}" alt="${i+1}" loading="lazy" onclick="goToPage(${i})">`
    ).join('');
}

function showPage(index, animate=false) {
    const b = state.currentBook; if (!b || index<0 || index>=b.images.length) return;
    const w = $('#pageImageWrapper'), img = $('#pageImage');
    if (animate) {
        w.classList.remove('flip-in'); void w.offsetWidth;
        w.classList.add('flip-out');
        setTimeout(()=>{ img.src = CONFIG.BASE_URL+encodePath(b.images[index].file); w.classList.remove('flip-out'); void w.offsetWidth; w.classList.add('flip-in');},180);
    } else {
        img.src = CONFIG.BASE_URL+encodePath(b.images[index].file);
        w.style.animation='none';void w.offsetWidth;w.style.animation='';
    }
    state.currentPageIndex=index;
    $('#pageIndicator').textContent=(index+1)+' / '+b.images.length;
    $$('#pageStrip .strip-thumb').forEach((t,i)=>{
        t.classList.toggle('active',i===index);
        if(i===index) t.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
    });
    saveReadingProgress();
}
function goToPage(i){showPage(i,true);}
function nextPage(){if(state.currentPageIndex<state.currentBook.images.length-1)showPage(state.currentPageIndex+1,true);}
function prevPage(){if(state.currentPageIndex>0)showPage(state.currentPageIndex-1,true);}

// Audio Sync
let autoNextEnabled = true; // 是否自动播放下一本
let nextBookShown = false; // 是否已显示下一本提示
let immersiveTimer = null;  // 沉浸模式定时器
const IMMERSIVE_DELAY = 5000; // 播放5秒后自动沉浸

const audio = () => $('#audioPlayer');

function getNextBook() {
    const currentFolder = state.currentBook ? state.currentBook.folder : null;
    let pool = state.filteredBooks.length > 0 ? state.filteredBooks : state.books;
    const idx = pool.findIndex(b => b.folder === currentFolder);
    if (idx < 0 || idx >= pool.length - 1) return null; // 没有下一本
    return pool[idx + 1];
}

function cancelAutoNext() {
    autoNextEnabled = false;
    hideNextBookToast();
}

function hideNextBookToast() {
    const toast = $('#nextBookToast');
    if (toast) toast.classList.remove('show');
    nextBookShown = false;
}

function showNextBookHint(nextBk) {
    const toast = $('#nextBookToast');
    if (!toast || !nextBk) return;
    $('#nextBookTitle').textContent = nextBk.title;
    toast.classList.add('show');
    nextBookShown = true;
}

function playNextBook() {
    const nextBk = getNextBook();
    if (nextBk && autoNextEnabled) {
        showToast('⏭ 自动播放：' + nextBk.title);
        openBook(nextBk.folder);
        autoNextEnabled = true;
        hideNextBookToast();
    }
}

function togglePlay(){
    const a=audio();if(!a.src)return;if(state.isPlaying){a.pause();}else{a.play().catch(()=>{});resetControlsTimer();}
}
audio()?.addEventListener?.('play',()=>{
    state.isPlaying=true;updatePlayButton();resetControlsTimer();
    startImmersiveTimer();
});
audio()?.addEventListener?.('pause',()=>{
    state.isPlaying=false;updatePlayButton();
    clearTimeout(controlsHideTimer);
    clearTimeout(immersiveTimer);
    $('#playerView')?.classList.remove('controls-hidden');
    exitImmersive();
});
audio()?.addEventListener?.('ended',()=>{
    state.isPlaying=false;updatePlayButton();
    clearTimeout(controlsHideTimer);
    clearTimeout(immersiveTimer);
    $('#playerView')?.classList.remove('controls-hidden');
    exitImmersive();
    playNextBook();
});
audio()?.addEventListener?.('timeupdate',()=>{
    const a = audio(); if(!a||!state.currentBook)return;
    const ct=a.currentTime;
    if(a.duration) $('#progressFill').style.width=((ct/a.duration)*100)+'%';
    $('#currentTime').textContent=formatTime(ct);

    // 结束前10秒提示即将播放下一本
    const remaining = a.duration - ct;
    if (remaining <= 10 && remaining > 0 && !nextBookShown && a.duration > 15) {
        const nextBk = getNextBook();
        if (nextBk && autoNextEnabled) {
            showNextBookHint(nextBk);
        }
    }

    // 翻页同步
    const tl=state.currentBook.timeline;
    if(tl&&tl.length>0){
        for(let i=0;i<tl.length;i++){
            if(ct>=tl[i].start&&ct<=tl[i].end){
                if(state.currentPageIndex!==i) showPage(i,false);
                break;
            }
        }
    }
});
function updatePlayButton(){ $('#playBtn').textContent = state.isPlaying ? '⏸' : '▶'; }
function skipForward(){const a=audio();a.currentTime=Math.min(a.currentTime+10,a.duration||99999);}
function skipBackward(){const a=audio();a.currentTime=Math.max(a.currentTime-10,0);}
function changeSpeed(d){state.playbackSpeed=Math.max(0.5,Math.min(2.0,Math.round((state.playbackSpeed+d)*100)/100));audio().playbackRate=state.playbackSpeed;$('#speedVal').textContent=state.playbackSpeed+'x';}
$('#progressContainer')?.addEventListener?.('click',e=>{const a=audio();if(!a.duration)return;const r=e.currentTarget.getBoundingClientRect();a.currentTime=((e.clientX-r.left)/r.width)*a.duration;});

// Favorites
function toggleFavorite(folder){
    const i=state.favorites.indexOf(folder);
    if(i>=0)state.favorites.splice(i,1);else state.favorites.push(folder);
    localStorage.setItem('pb_favorites',JSON.stringify(state.favorites));
    updateFavBadge(); applyFilters();
}
function updateFavBadge(){
    const b=$('#favBadgeCount');
    if(state.favorites.length>0){b.textContent=state.favorites.length;b.style.display='';}else b.style.display='none';
    $('#favNavBtn').classList.toggle('active',state.showFavoritesOnly);
}
function togglePlayerFav(){if(state.currentBook)toggleFavorite(state.currentBook.folder);updatePlayerFavBtn();}
function updatePlayerFavBtn(){
    const btn=$('#playerFavBtn');
    if(state.currentBook&&state.favorites.includes(state.currentBook.folder)){btn.textContent='❤️';btn.classList.add('fav-active');}
    else{btn.textContent='♡';btn.classList.remove('fav-active');}
}
function toggleFavFilter(){state.showFavoritesOnly=!state.showFavoritesOnly;state.showRecentOnly=false;$('#favNavBtn').classList.toggle('active',state.showFavoritesOnly);$('#recentNavBtn').classList.toggle('active',false);applyFilters();}
function toggleRecentFilter(){state.showRecentOnly=!state.showRecentOnly;state.showFavoritesOnly=false;$('#recentNavBtn').classList.toggle('active',state.showRecentOnly);$('#favNavBtn').classList.toggle('active',false);applyFilters();}

// Series
function filterBySeries(series){state.activeSeriesFilter=series;$$('.series-option').forEach(o=>o.classList.toggle('active',(o.dataset.series||'all')===series));updateSeriesInputText();applyFilters();}

// Theme
function setTheme(theme){state.theme=theme;document.body.setAttribute('data-theme',theme);localStorage.setItem('pb_theme',theme);$$('.theme-option').forEach(o=>o.classList.toggle('active',o.dataset.theme===theme));$('.theme-switcher').textContent=theme==='dark'?'☀️':theme==='sepia'?'🌅':'🌙';closeThemeMenu();}
function toggleThemeMenu(){$('#themeDropdown').classList.toggle('show');}
function closeThemeMenu(){$('#themeDropdown').classList.remove('show');}
document.addEventListener('click',e=>{if(!e.target.closest('.theme-switcher'))closeThemeMenu();});

// Fullscreen
// 沉浸模式 - 图片填满屏幕，控件完全隐藏
function toggleImmersive() {
    const pv = $('#playerView');
    if (pv.classList.contains('immersive')) {
        exitImmersive();
    } else {
        enterImmersive();
    }
}

function enterImmersive() {
    $('#playerView').classList.add('immersive');
    clearTimeout(immersiveTimer);
    // 隐藏关闭和全屏按钮，只留翻页
    $$('.stage-close-btn, .stage-fs-btn').forEach(btn => btn.style.opacity = '0');
    // 退出控件隐藏状态（因为沉浸模式已经隐藏了所有控件）
    pv.classList.remove('controls-hidden');
}

function exitImmersive() {
    const pv = $('#playerView');
    pv.classList.remove('immersive');
    $$('.stage-close-btn, .stage-fs-btn').forEach(btn => btn.style.opacity = '');
    resetControlsTimer();
}

// 播放5秒后自动进入沉浸模式
function startImmersiveTimer() {
    clearTimeout(immersiveTimer);
    const pv = $('#playerView');
    if (pv && pv.classList.contains('active') && state.isPlaying && !pv.classList.contains('immersive')) {
        immersiveTimer = setTimeout(() => {
            if ($('#playerView')?.classList.contains('active') && state.isPlaying) {
                enterImmersive();
            }
        }, IMMERSIVE_DELAY);
    }
}

// Progress Persistence
function saveReadingProgress(){if(!state.currentBook)return;state.readingProgress[state.currentBook.folder]={page:state.currentPageIndex,time:Date.now()};localStorage.setItem('pb_progress',JSON.stringify(state.readingProgress));}

// Navigation
function goHome(){state.activeSeriesFilter='all';state.sortBy='default';$$('.sort-btn').forEach(b=>b.classList.toggle('active',b.dataset.sort==='default'));state.showFavoritesOnly=false;state.showRecentOnly=false;state.searchQuery='';$('#searchInput').value='';$('#favNavBtn').classList.remove('active');$('#recentNavBtn').classList.remove('active');updateSeriesInputText();applyFilters();renderFilters();window.scrollTo({top:0,behavior:'smooth'});}

$('#searchInput')?.addEventListener?.('input', e=>debouncedSearch(e.target.value));

// Keyboard Shortcuts
document.addEventListener('keydown', e=>{
    if(!$('#playerView').classList.contains('active'))return;
    switch(e.key){case'Escape':closePlayer();break;case'ArrowLeft':prevPage();break;case'ArrowRight':nextPage();break;case' ':e.preventDefault();togglePlay();break;case'f':case'F':if(!e.ctrlKey&&!e.metaKey)toggleImmersive();break;}
});

setInterval(()=>{if($('#playerView').classList.contains('active'))saveReadingProgress();},5000);

// Sort
function setSort(sortBy){state.sortBy=sortBy;$$('.sort-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.sort===sortBy));applyFilters();}

// Random Pick
function openRandomBook(){const pool=state.filteredBooks.length>0?state.filteredBooks:state.books;if(!pool.length)return;const r=pool[Math.floor(Math.random()*pool.length)];showToast('🎲 为你推荐：'+r.title);openBook(r.folder);}

// Toast
function showToast(msg,dur=2000){const c=$('#toastContainer');const t=document.createElement('div');t.className='toast';t.textContent=msg;c.appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},dur);}

// Touch Swipe
(function(){
    const stage=document.getElementById('playerStage');let sx,sy,ex,ey;
    stage.addEventListener('touchstart',e=>{sx=e.changedTouches[0].screenX;sy=e.changedTouches[0].screenY;},{passive:true});
    stage.addEventListener('touchend',e=>{ex=e.changedTouches[0].screenX;ey=e.changedTouches[0].screenY;const dx=ex-sx,dy=ey-sy;if(Math.abs(dx)<50||Math.abs(dy)>Math.abs(dx))return;if(dx>0)prevPage();else nextPage();},{passive:true});
})();

// Init
(function(){ setTheme(state.theme); loadBooksData(); })();
</script>
</body>
</html>
